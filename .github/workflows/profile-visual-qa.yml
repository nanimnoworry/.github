name: Profile visual QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate profile contracts
        run: python scripts/validate_profile.py

      - name: Build visual QA pages
        run: python scripts/build_visual_qa.py

      - name: Render Chromium contact sheets
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 45s "$CHROME" --headless --disable-gpu --disable-dev-shm-usage --no-sandbox --hide-scrollbars --allow-file-access-from-files             --window-size=1800,5400 --screenshot="$PWD/qa/contact-sheet.png" "file://$PWD/qa/contact-sheet.html"
          timeout 45s "$CHROME" --headless --disable-gpu --disable-dev-shm-usage --no-sandbox --hide-scrollbars --allow-file-access-from-files             --window-size=460,5200 --screenshot="$PWD/qa/mobile-sheet.png" "file://$PWD/qa/mobile-sheet.html"

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: profile-visual-qa
          path: |
            qa/contact-sheet.html
            qa/mobile-sheet.html
            qa/contact-sheet.png
            qa/mobile-sheet.png
          if-no-files-found: error
