<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="464" viewBox="0 0 1600 464" role="img" aria-labelledby="title desc">
<title id="title">Official model journey</title><desc id="desc">Four equal cards share label, primary, metric, and note baselines across the official lineage and separate post-submission research.</desc>
<rect width="1600" height="464" rx="32" fill="#0B1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="96" y="72" fill="#F8FAFC" font-size="30" font-weight="830"><tspan>MODEL JOURNEY</tspan></text></g><text x="96" y="108" fill="#64748B" font-size="17"><tspan>Official submission lineage first · post-submission research stays outside the historical result.</tspan></text>
  <path d="M248 264 H1352" stroke="#334155" stroke-width="4"/><g fill="#64748B"><path d="M432 264 l-14 -9 v18z"/><path d="M800 264 l-14 -9 v18z"/><path d="M1168 264 l-14 -9 v18z"/></g>
  <g data-card-set="row" data-grid="16">
    <g data-card="plan1"><rect x="96" y="160" width="304" height="208" rx="24" fill="#101A2B" stroke="#334155"/><text data-role="label" x="128" y="208" fill="#94A3B8" font-size="14" font-weight="820" letter-spacing="2"><tspan>PLAN 1 · BASELINE</tspan></text><text data-role="primary" x="128" y="258" fill="#F8FAFC" font-size="24" font-weight="800"><tspan>OOF ensemble</tspan></text><text data-role="metric" x="128" y="312" fill="#CBD5E1" font-size="24" font-weight="840"><tspan>0.74213</tspan></text><text data-role="note" x="128" y="342" fill="#64748B" font-size="14"><tspan>submission AUC</tspan></text></g>
    <g data-card="plan2"><rect x="464" y="160" width="304" height="208" rx="24" fill="#0F2236" stroke="#38BDF8" stroke-width="2"/><text data-role="label" x="496" y="208" fill="#38BDF8" font-size="14" font-weight="820" letter-spacing="1.5"><tspan>PLAN 2 · HIGHEST</tspan></text><text data-role="primary" x="496" y="258" fill="#F8FAFC" font-size="21" font-weight="800"><tspan>Feature expansion + stacking</tspan></text><text data-role="metric" x="496" y="312" fill="#BAE6FD" font-size="24" font-weight="850"><tspan>0.74232</tspan></text><text data-role="note" x="496" y="342" fill="#64748B" font-size="14"><tspan>highest submitted AUC</tspan></text></g>
    <g data-card="plan3"><rect x="832" y="160" width="304" height="208" rx="24" fill="#17142A" stroke="#A78BFA" stroke-width="3"/><text data-role="label" x="864" y="208" fill="#A78BFA" font-size="14" font-weight="820" letter-spacing="1.5"><tspan>PLAN 3 · FINAL</tspan></text><text data-role="primary" x="864" y="258" fill="#F8FAFC" font-size="24" font-weight="800"><tspan>OOF + Multi-Seed</tspan></text><text data-role="metric" x="864" y="312" fill="#DDD6FE" font-size="24" font-weight="850"><tspan>0.74231</tspan></text><text data-role="note" x="864" y="342" fill="#94A3B8" font-size="13"><tspan>final adopted submission model</tspan></text></g>
    <g data-card="post"><rect x="1200" y="160" width="304" height="208" rx="24" fill="#111827" stroke="#475569" stroke-dasharray="10 10"/><text data-role="label" x="1232" y="208" fill="#94A3B8" font-size="13" font-weight="820" letter-spacing="1.4"><tspan>POST-SUBMISSION</tspan></text><text data-role="primary" x="1232" y="258" fill="#F8FAFC" font-size="23" font-weight="800"><tspan>planB research</tspan></text><text data-role="metric" x="1232" y="312" fill="#CBD5E1" font-size="18" font-weight="800"><tspan>separate lineage</tspan></text><text data-role="note" x="1232" y="342" fill="#64748B" font-size="14"><tspan>official result unchanged</tspan></text></g>
  </g>
  <g data-motion-role="ambient"><circle cx="984" cy="148" r="5" fill="#A78BFA"><animate attributeName="opacity" values=".3;1;.3" dur="8.4s" repeatCount="indefinite"/></circle></g>
</g>
</svg>