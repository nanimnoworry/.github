<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Fertility project model lineage</title>
  <desc id="desc">Plan 1 to Plan 2 to Plan 3 final adopted, followed by post-submission planB research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="final" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="56" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">MODEL LINEAGE</text>
  <text x="56" y="76" font-family="Arial, sans-serif" font-size="15" fill="#64748b">최고 제출 점수와 최종 채택 모델을 분리해 기록합니다.</text>

  <g stroke="#94a3b8" stroke-width="3" fill="none">
    <path d="M255 169 H330"/><path d="M520 169 H595"/><path d="M785 169 H860"/>
  </g>
  <g fill="#94a3b8"><path d="M330 169 l-12 -7 v14z"/><path d="M595 169 l-12 -7 v14z"/><path d="M860 169 l-12 -7 v14z"/></g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="55" y="110" width="200" height="118" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="78" y="142" font-size="15" font-weight="700" fill="#64748b">PLAN 1</text>
    <text x="78" y="172" font-size="20" font-weight="800" fill="#0f172a">OOF Baseline</text>
    <text x="78" y="202" font-size="16" fill="#475569">AUC 0.74213</text>

    <rect x="330" y="110" width="190" height="118" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="353" y="142" font-size="15" font-weight="700" fill="#7c3aed">PLAN 2</text>
    <text x="353" y="172" font-size="19" font-weight="800" fill="#0f172a">Feature + Stacking</text>
    <text x="353" y="202" font-size="16" fill="#7c3aed">Highest · 0.74232</text>

    <rect x="595" y="100" width="190" height="138" rx="20" fill="url(#final)" stroke="#10b981" stroke-width="2.5"/>
    <text x="618" y="136" font-size="15" font-weight="700" fill="#059669">PLAN 3</text>
    <text x="618" y="166" font-size="19" font-weight="800" fill="#0f172a">OOF + Multi-Seed</text>
    <text x="618" y="196" font-size="16" font-weight="700" fill="#059669">Final · 0.74231</text>
    <text x="618" y="220" font-size="13" fill="#64748b">Production adopted</text>

    <rect x="860" y="110" width="280" height="118" rx="18" fill="#fff7ed" stroke="#fb923c"/>
    <text x="883" y="142" font-size="15" font-weight="700" fill="#ea580c">POST-SUBMISSION</text>
    <text x="883" y="172" font-size="20" font-weight="800" fill="#0f172a">planB Research</text>
    <text x="883" y="202" font-size="15" fill="#475569">Stage12 champion · 0.7423208756</text>
  </g>

  <circle cx="690" cy="89" r="5" fill="#10b981"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>