<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Fertility project model lineage</title>
  <desc id="desc">Plan 1, Plan 2 highest submission, Plan 3 final adopted, and post-submission planB research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="final" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="56" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">MODEL LINEAGE</text>
  <text x="56" y="76" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Highest submission ≠ final adopted model</text>
  <g stroke="#94a3b8" stroke-width="3" fill="none" vector-effect="non-scaling-stroke">
    <path d="M255 169 H315"/><path d="M530 169 H575"/><path d="M790 169 H835"/>
  </g>
  <g fill="#94a3b8"><path d="M315 169 l-12 -7 v14z"/><path d="M575 169 l-12 -7 v14z"/><path d="M835 169 l-12 -7 v14z"/></g>
  <g font-family="Arial, sans-serif">
    <g fill="#0f172a" opacity="0.10">
      <rect x="55" y="116" width="200" height="118" rx="18"/>
      <rect x="315" y="116" width="215" height="118" rx="18"/>
      <rect x="575" y="116" width="215" height="118" rx="18"/>
      <rect x="835" y="116" width="310" height="118" rx="18"/>
    </g>
    <rect x="55" y="110" width="200" height="118" rx="18" fill="#ffffff" stroke="#cbd5e1" vector-effect="non-scaling-stroke"/>
    <text x="78" y="142" font-size="15" font-weight="700" fill="#64748b">PLAN 1</text>
    <text x="78" y="172" font-size="20" font-weight="800" fill="#0f172a">OOF Baseline</text>
    <text x="78" y="202" font-size="16" fill="#475569">AUC 0.74213</text>
    <rect x="315" y="110" width="215" height="118" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="331" y="142" font-size="15" font-weight="700" fill="#7c3aed">PLAN 2</text>
    <text x="331" y="172" font-size="19" font-weight="800" fill="#0f172a">Feature + Stacking</text>
    <text x="331" y="202" font-size="16" fill="#7c3aed">Highest · 0.74232</text>
    <rect x="575" y="110" width="215" height="118" rx="18" fill="url(#final)" stroke="#10b981" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <text x="598" y="138" font-size="15" font-weight="700" fill="#059669">PLAN 3</text>
    <text x="598" y="166" font-size="19" font-weight="800" fill="#0f172a">OOF + Multi-Seed</text>
    <text x="598" y="193" font-size="16" font-weight="700" fill="#059669">Final · 0.74231</text>
    <text x="598" y="216" font-size="13" fill="#64748b">Production adopted</text>
    <rect x="835" y="110" width="310" height="118" rx="18" fill="#fff7ed" stroke="#fb923c" vector-effect="non-scaling-stroke"/>
    <text x="858" y="142" font-size="15" font-weight="700" fill="#ea580c">POST-SUBMISSION</text>
    <text x="858" y="172" font-size="20" font-weight="800" fill="#0f172a">planB Research</text>
    <text x="858" y="202" font-size="15" fill="#475569">Stage12 champion · 0.7423208756</text>
  </g>
  <circle cx="682" cy="96" r="5" fill="#10b981"/>
  <circle cx="682" cy="96" r="5" fill="none" stroke="#10b981" stroke-width="2" opacity="0.55" vector-effect="non-scaling-stroke">
    <animate attributeName="r" values="5;11;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
