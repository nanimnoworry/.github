<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="496" viewBox="0 0 1600 496" role="img" aria-labelledby="title desc">
  <title id="title">Validation and decision evidence</title>
  <desc id="desc">The highest submitted score and final adopted submission model are shown as distinct decisions, with the final adoption balancing score with validation burden, stability, complexity, and inference cost.</desc>
  <rect width="1600" height="496" rx="32" fill="#F8FAFC"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true">
      <text x="80" y="72" fill="#0B1220" font-size="30" font-weight="820"><tspan>VALIDATION ≠ ONE NUMBER</tspan></text>
    </g>
    <text x="80" y="108" fill="#64748B" font-size="17"><tspan>The project preserved the difference between “highest submitted” and “final adopted”.</tspan></text>

    <g data-grid="16">
      <rect x="80" y="160" width="672" height="224" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/>
      <rect x="768" y="160" width="752" height="224" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/>
    </g>

    <text x="112" y="204" fill="#0284C7" font-size="14" font-weight="820" letter-spacing="2"><tspan>HIGHEST SUBMITTED · PLAN 2</tspan></text>
    <text x="112" y="272" fill="#0B1220" font-size="52" font-weight="840"><tspan>0.74232</tspan></text>
    <text x="112" y="318" fill="#475569" font-size="18"><tspan>feature expansion · weighted / stacking</tspan></text>
    <text x="112" y="350" fill="#64748B" font-size="16"><tspan>Historical benchmark, not the final adoption decision.</tspan></text>

    <text x="800" y="204" fill="#7C5FD1" font-size="14" font-weight="820" letter-spacing="2"><tspan>FINAL ADOPTED SUBMISSION MODEL · PLAN 3</tspan></text>
    <text x="800" y="272" fill="#0B1220" font-size="52" font-weight="840"><tspan>0.74231</tspan></text>
    <text x="800" y="318" fill="#475569" font-size="18"><tspan>OOF + Multi-Seed · simpler validation and inference path</tspan></text>
    <text x="800" y="350" fill="#64748B" font-size="16"><tspan>Adoption considered complexity, validation burden, seed variability, and compute.</tspan></text>

    <rect x="80" y="416" width="1440" height="1" fill="#CBD5E1"/>
    <text x="80" y="454" fill="#64748B" font-size="15"><tspan>Scope boundary: hackathon / research evidence only · no claim of clinical validation, diagnosis, or medical decision performance.</tspan></text>
  </g>
</svg>
