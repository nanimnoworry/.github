<svg xmlns="http://www.w3.org/2000/svg" width="800" height="992" viewBox="0 0 800 992" role="img" aria-labelledby="title desc">
<title id="title">NANIM NO WORRY mobile evidence assay — Light Theme</title><desc id="desc">Light-theme mobile evidence assay matching the dark-theme geometry while integrating with GitHub light mode.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F5F1FA"/></linearGradient><radialGradient id="aura"><stop stop-color="#A78BFA" stop-opacity=".2"/><stop offset=".55" stop-color="#38BDF8" stop-opacity=".07"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="800" height="992" rx="32" fill="url(#bg)" stroke="#D7E0EA"/>
<g data-motion-role="ambient"><circle cx="400" cy="808" r="176" fill="url(#aura)" opacity=".64"><animate attributeName="opacity" values=".48;.7;.48" dur="12s" repeatCount="indefinite"/></circle></g>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="84" fill="#0284C7" font-size="26" font-weight="820" letter-spacing="2"><tspan>FERTILITY AI · EVIDENCE ASSAY</tspan></text></g><text x="64" y="160" fill="#0B1220" font-size="58" font-weight="850"><tspan>NANIM NO WORRY</tspan></text><text x="64" y="214" fill="#334155" font-size="28" font-weight="700"><tspan>Fertility outcome prediction research</tspan></text><text x="64" y="266" fill="#475569" font-size="24"><tspan>Structural context → OOF validation → evidence</tspan></text>
  <g data-card-set="stack" data-grid="16">
    <g data-card="mobile-signal"><rect x="64" y="320" width="672" height="96" rx="24" fill="#FFFFFF" stroke="#38BDF8"/><text data-role="primary" x="96" y="368" dominant-baseline="middle" fill="#075985" font-size="28" font-weight="780"><tspan>Clinical signals</tspan></text></g>
    <g data-card="mobile-context"><rect x="64" y="432" width="672" height="96" rx="24" fill="#FFF4F1" stroke="#FB7185"/><text data-role="primary" x="96" y="480" dominant-baseline="middle" fill="#BE123C" font-size="28" font-weight="780"><tspan>Structural missingness context</tspan></text></g>
    <g data-card="mobile-models"><rect x="64" y="544" width="672" height="96" rx="24" fill="#F5F3FF" stroke="#A78BFA"/><text data-role="primary" x="96" y="592" dominant-baseline="middle" fill="#6D28D9" font-size="28" font-weight="780"><tspan>CatBoost · LightGBM · XGBoost</tspan></text></g>
  </g>
  <path d="M400 640 V688" stroke="#7C3AED" stroke-width="3" opacity=".55"/>
  <g data-motion-role="particle"><circle cy="664" r="5" fill="#7C3AED" filter="url(#g)"><animate attributeName="cx" values="280;520" dur="5.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.8s" repeatCount="indefinite"/></circle></g>
  <g data-motion-role="orbital" transform="translate(400 806)"><circle r="106" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="14 14" opacity=".3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle><circle r="82" fill="none" stroke="#7C3AED" stroke-width="4" stroke-dasharray="32 12" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/></circle><g opacity=".38"><line x1="0" y1="-54" x2="0" y2="-106" stroke="#334155" stroke-width="3"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10.5s" repeatCount="indefinite"/></g></g>
  <g data-motion-role="pulse"><circle cx="400" cy="806" r="54" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/><circle cx="400" cy="806" r="17" fill="#0F172A" filter="url(#g)"><animate attributeName="r" values="14;20;14" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".62;1;.62" dur="6.2s" repeatCount="indefinite"/></circle></g>
  <text x="302" y="950" fill="#334155" font-size="26" font-weight="820"><tspan>OOF EVIDENCE</tspan></text>
</g>
</svg>