<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Evidence pipeline</title>
  <desc id="desc">Five-stage research pipeline from competition tabular data through structural context, model diversity, OOF validation, and final evidence.</desc>
  <rect width="1600" height="480" rx="32" fill="#F8FAFC"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true">
      <text x="80" y="74" fill="#0B1220" font-size="30" font-weight="820"><tspan>EVIDENCE PIPELINE</tspan></text>
    </g>
    <text x="80" y="110" fill="#64748B" font-size="17"><tspan>What moves forward is evidence, not decoration.</tspan></text>

    <path d="M208 244 H1392" stroke="#CBD5E1" stroke-width="4"/>
    <g fill="#94A3B8">
      <path d="M432 244 l-14 -9 v18z"/><path d="M704 244 l-14 -9 v18z"/><path d="M976 244 l-14 -9 v18z"/><path d="M1248 244 l-14 -9 v18z"/>
    </g>

    <g data-grid="16">
      <rect x="80" y="160" width="256" height="176" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="352" y="160" width="256" height="176" rx="24" fill="#FFF7F5" stroke="#FFB5A8"/>
      <rect x="624" y="160" width="256" height="176" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/>
      <rect x="896" y="160" width="256" height="176" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/>
      <rect x="1168" y="160" width="352" height="176" rx="24" fill="#0B1220" stroke="#0B1220"/>
    </g>

    <text x="112" y="202" fill="#64748B" font-size="14" font-weight="800" letter-spacing="2"><tspan>01 · SIGNALS</tspan></text>
    <text x="112" y="242" fill="#0B1220" font-size="23" font-weight="780"><tspan>Competition table</tspan></text>
    <text x="112" y="278" fill="#64748B" font-size="16"><tspan>age · treatment · embryo</tspan></text>
    <text x="112" y="304" fill="#64748B" font-size="16"><tspan>history · donor source</tspan></text>

    <text x="384" y="202" fill="#D95F4F" font-size="14" font-weight="800" letter-spacing="2"><tspan>02 · CONTEXT</tspan></text>
    <text x="384" y="242" fill="#0B1220" font-size="23" font-weight="780"><tspan>Structural missingness</tspan></text>
    <text x="384" y="278" fill="#64748B" font-size="16"><tspan>not-applicable patterns</tspan></text>
    <text x="384" y="304" fill="#64748B" font-size="16"><tspan>preserved as signal</tspan></text>

    <text x="656" y="202" fill="#7C5FD1" font-size="14" font-weight="800" letter-spacing="2"><tspan>03 · DIVERSITY</tspan></text>
    <text x="656" y="242" fill="#0B1220" font-size="23" font-weight="780"><tspan>Model lanes</tspan></text>
    <text x="656" y="278" fill="#64748B" font-size="16"><tspan>CatBoost · LightGBM</tspan></text>
    <text x="656" y="304" fill="#64748B" font-size="16"><tspan>XGBoost · ensembles</tspan></text>

    <text x="928" y="202" fill="#0284C7" font-size="14" font-weight="800" letter-spacing="2"><tspan>04 · VALIDATION</tspan></text>
    <text x="928" y="242" fill="#0B1220" font-size="23" font-weight="780"><tspan>OOF-first review</tspan></text>
    <text x="928" y="278" fill="#64748B" font-size="16"><tspan>K-fold comparison</tspan></text>
    <text x="928" y="304" fill="#64748B" font-size="16"><tspan>stability over one split</tspan></text>

    <text x="1200" y="202" fill="#38BDF8" font-size="14" font-weight="800" letter-spacing="2"><tspan>05 · EVIDENCE</tspan></text>
    <text x="1200" y="238" fill="#F8FAFC" font-size="23" font-weight="800"><tspan>Score + complexity</tspan></text>
    <text x="1200" y="268" fill="#F8FAFC" font-size="23" font-weight="800"><tspan>+ stability</tspan></text>
    <text x="1200" y="302" fill="#CBD5E1" font-size="15"><tspan>Highest submitted and final adopted</tspan></text>
    <text x="1200" y="326" fill="#CBD5E1" font-size="15"><tspan>remain explicitly separate.</tspan></text>

    <circle cx="1490" cy="188" r="6" fill="#38BDF8" opacity="0.8">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
