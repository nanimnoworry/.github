<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="272" viewBox="0 0 1600 272" role="img" aria-labelledby="title desc">
<title id="title">Research scope endcap</title><desc id="desc">Closing research-scope statement aligned to the same 96 pixel content axis as the other desktop panels.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08111F"/><stop offset=".58" stop-color="#0B1220"/><stop offset="1" stop-color="#17142A"/></linearGradient></defs>
<rect width="1600" height="272" rx="32" fill="url(#bg)"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="96" y="88" fill="#38BDF8" font-size="15" font-weight="820" letter-spacing="3"><tspan>RESEARCH SCOPE</tspan></text>
  <text x="96" y="148" fill="#F8FAFC" font-size="34" font-weight="820"><tspan>Clinical context → reproducible validation → evidence.</tspan></text>
  <text x="96" y="196" fill="#94A3B8" font-size="18"><tspan>Competition research only · not a clinical diagnostic or medical decision system.</tspan></text>
  <g data-motion-role="ambient"><circle cx="1488" cy="136" r="7" fill="#A78BFA" opacity=".72"><animate attributeName="opacity" values=".42;.82;.42" dur="8.6s" repeatCount="indefinite"/></circle></g>
</g>
</svg>