<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="272" viewBox="0 0 1600 272" role="img" aria-labelledby="title desc">
  <title id="title">Research scope endcap</title>
  <desc id="desc">Closing statement for the NANIM NO WORRY project: clinical context, reproducible validation, and explicit research scope.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.58" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#17142A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="272" rx="32" fill="url(#footerBg)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="88" fill="#38BDF8" font-size="15" font-weight="820" letter-spacing="3"><tspan>RESEARCH SCOPE</tspan></text>
    <text x="80" y="148" fill="#F8FAFC" font-size="34" font-weight="820"><tspan>Clinical context → reproducible validation → evidence.</tspan></text>
    <text x="80" y="196" fill="#94A3B8" font-size="18"><tspan>Competition research only · not a clinical diagnostic or medical decision system.</tspan></text>
    <circle cx="1488" cy="136" r="7" fill="#A78BFA" opacity="0.75">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="5.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
