<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="416" viewBox="0 0 1600 416" role="img" aria-labelledby="title desc">
  <title id="title">Project snapshot</title>
  <desc id="desc">Snapshot of the competition task, dataset scale, evaluation metric, and central research insight.</desc>
  <rect width="1600" height="416" rx="32" fill="#0B1220"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true">
      <text x="80" y="72" fill="#F8FAFC" font-size="30" font-weight="800"><tspan>PROJECT SNAPSHOT</tspan></text>
    </g>
    <text x="80" y="108" fill="#64748B" font-size="17"><tspan>Competition data · binary classification · reproducible research boundary</tspan></text>

    <g data-grid="16">
      <rect x="80" y="144" width="336" height="192" rx="24" fill="#101A2B" stroke="#223149"/>
      <rect x="432" y="144" width="336" height="192" rx="24" fill="#101A2B" stroke="#223149"/>
      <rect x="784" y="144" width="336" height="192" rx="24" fill="#101A2B" stroke="#223149"/>
      <rect x="1136" y="144" width="384" height="192" rx="24" fill="#17142A" stroke="#6D5AA0"/>
    </g>

    <text x="112" y="188" fill="#38BDF8" font-size="15" font-weight="800" letter-spacing="2"><tspan>TRAIN</tspan></text>
    <text x="112" y="246" fill="#F8FAFC" font-size="42" font-weight="820"><tspan>256,351</tspan></text>
    <text x="112" y="282" fill="#94A3B8" font-size="18"><tspan>rows · 69 columns</tspan></text>

    <text x="464" y="188" fill="#38BDF8" font-size="15" font-weight="800" letter-spacing="2"><tspan>TEST</tspan></text>
    <text x="464" y="246" fill="#F8FAFC" font-size="42" font-weight="820"><tspan>90,067</tspan></text>
    <text x="464" y="282" fill="#94A3B8" font-size="18"><tspan>rows · 68 columns</tspan></text>

    <text x="816" y="188" fill="#A78BFA" font-size="15" font-weight="800" letter-spacing="2"><tspan>OFFICIAL METRIC</tspan></text>
    <text x="816" y="246" fill="#F8FAFC" font-size="42" font-weight="820"><tspan>ROC-AUC</tspan></text>
    <text x="816" y="282" fill="#94A3B8" font-size="18"><tspan>probability ranking quality</tspan></text>

    <text x="1168" y="188" fill="#FF7A66" font-size="15" font-weight="800" letter-spacing="2"><tspan>CENTRAL INSIGHT</tspan></text>
    <text x="1168" y="234" fill="#F8FAFC" font-size="24" font-weight="760"><tspan>Missingness can encode</tspan></text>
    <text x="1168" y="266" fill="#F8FAFC" font-size="24" font-weight="760"><tspan>treatment structure.</tspan></text>
    <text x="1168" y="306" fill="#94A3B8" font-size="16"><tspan>IVF / DI context before generic imputation</tspan></text>
  </g>
</svg>
