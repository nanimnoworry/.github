<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1248" viewBox="0 0 800 1248" role="img" aria-labelledby="title desc">
  <title id="title">Repository system mobile</title><desc id="desc">Vertical public and private repository role map.</desc>
  <rect width="800" height="1248" rx="32" fill="#0B1220"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
