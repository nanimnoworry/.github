<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Repository system mobile</title><desc id="desc">Four equal stacked repository role cards on mobile.</desc>
  <rect width="800" height="1200" rx="32" fill="#0B1220"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true"><text x="64" y="80" fill="#F8FAFC" font-size="38" font-weight="830"><tspan>REPOSITORY SYSTEM</tspan></text></g>
    <text x="64" y="126" fill="#94A3B8" font-size="24"><tspan>Public surface · internal research separated</tspan></text>
    <g data-card-stack="true" data-grid="16">
      <rect x="64" y="176" width="672" height="224" rx="24" fill="#0F2236" stroke="#38BDF8" stroke-width="4"/>
      <rect x="64" y="416" width="672" height="224" rx="24" fill="#101A2B" stroke="#38BDF8"/>
      <rect x="64" y="656" width="672" height="224" rx="24" fill="#111827" stroke="#475569"/>
      <rect x="64" y="896" width="672" height="224" rx="24" fill="#111827" stroke="#475569"/>
    </g>
    <text x="96" y="228" fill="#38BDF8" font-size="24" font-weight="820"><tspan>PUBLIC · OFFICIAL PROJECT SSOT</tspan></text><text x="96" y="306" fill="#F8FAFC" font-size="52" font-weight="850"><tspan>PSP</tspan></text><text x="96" y="358" fill="#CBD5E1" font-size="26"><tspan>final result · lineage · provenance</tspan></text>
    <text x="96" y="468" fill="#38BDF8" font-size="24" font-weight="820"><tspan>PUBLIC · MODELING WORKSPACE</tspan></text><text x="96" y="546" fill="#F8FAFC" font-size="40" font-weight="830"><tspan>BS</tspan></text><text x="160" y="546" fill="#94A3B8" font-size="25"><tspan>Plan 3 OOF / ensemble research</tspan></text>
    <text x="96" y="708" fill="#94A3B8" font-size="24" font-weight="820"><tspan>PRIVATE · POST-SUBMISSION</tspan></text><text x="96" y="786" fill="#F8FAFC" font-size="40" font-weight="830"><tspan>planB</tspan></text><text x="224" y="786" fill="#94A3B8" font-size="25"><tspan>bootstrap · slice review</tspan></text>
    <text x="96" y="948" fill="#94A3B8" font-size="24" font-weight="820"><tspan>PRIVATE · EVIDENCE ARCHIVE</tspan></text><text x="96" y="1026" fill="#F8FAFC" font-size="40" font-weight="830"><tspan>Research-Papers</tspan></text><text x="96" y="1072" fill="#94A3B8" font-size="25"><tspan>literature · presentation provenance</tspan></text>
  </g>
</svg>