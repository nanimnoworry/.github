<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1184" viewBox="0 0 800 1184" role="img" aria-labelledby="title desc">
<title id="title">Repository system mobile</title><desc id="desc">Four equal stacked repository cards use shared label, primary, and secondary baselines.</desc>
<rect width="800" height="1184" rx="32" fill="#0B1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="80" fill="#F8FAFC" font-size="38" font-weight="830"><tspan>REPOSITORY SYSTEM</tspan></text></g><text x="64" y="126" fill="#94A3B8" font-size="24"><tspan>Public surface · internal research separated</tspan></text>
  <g data-card-set="stack" data-grid="16">
    <g data-card="psp"><rect x="64" y="176" width="672" height="216" rx="24" fill="#0F2236" stroke="#38BDF8" stroke-width="4"/><text data-role="label" x="96" y="228" fill="#38BDF8" font-size="24" font-weight="820"><tspan>PUBLIC · OFFICIAL PROJECT SSOT</tspan></text><text data-role="primary" x="96" y="300" fill="#F8FAFC" font-size="48" font-weight="850"><tspan>PSP</tspan></text><text data-role="secondary" x="96" y="350" fill="#CBD5E1" font-size="26"><tspan>final result · lineage · provenance</tspan></text></g>
    <g data-card="bs"><rect x="64" y="408" width="672" height="216" rx="24" fill="#101A2B" stroke="#38BDF8"/><text data-role="label" x="96" y="460" fill="#38BDF8" font-size="24" font-weight="820"><tspan>PUBLIC · MODELING WORKSPACE</tspan></text><text data-role="primary" x="96" y="532" fill="#F8FAFC" font-size="40" font-weight="830"><tspan>BS</tspan></text><text data-role="secondary" x="96" y="582" fill="#94A3B8" font-size="25"><tspan>Plan 3 OOF / ensemble research</tspan></text></g>
    <g data-card="planb"><rect x="64" y="640" width="672" height="216" rx="24" fill="#111827" stroke="#475569"/><text data-role="label" x="96" y="692" fill="#94A3B8" font-size="24" font-weight="820"><tspan>PRIVATE · POST-SUBMISSION</tspan></text><text data-role="primary" x="96" y="764" fill="#F8FAFC" font-size="40" font-weight="830"><tspan>planB</tspan></text><text data-role="secondary" x="96" y="814" fill="#94A3B8" font-size="25"><tspan>bootstrap · slice review</tspan></text></g>
    <g data-card="papers"><rect x="64" y="872" width="672" height="216" rx="24" fill="#111827" stroke="#475569"/><text data-role="label" x="96" y="924" fill="#94A3B8" font-size="24" font-weight="820"><tspan>PRIVATE · EVIDENCE ARCHIVE</tspan></text><text data-role="primary" x="96" y="996" fill="#F8FAFC" font-size="38" font-weight="830"><tspan>Research-Papers</tspan></text><text data-role="secondary" x="96" y="1046" fill="#94A3B8" font-size="25"><tspan>literature · presentation provenance</tspan></text></g>
  </g>
</g>
</svg>