<svg xmlns="http://www.w3.org/2000/svg" width="800" height="464" viewBox="0 0 800 464" role="img" aria-labelledby="title desc">
  <title id="title">Research scope mobile endcap</title><desc id="desc">Mobile closing research scope statement.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08111F"/><stop offset="1" stop-color="#17142A"/></linearGradient></defs>
  <rect width="800" height="464" rx="32" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="92" fill="#38BDF8" font-size="26" font-weight="820" letter-spacing="2"><tspan>RESEARCH SCOPE</tspan></text>
    <text x="64" y="164" fill="#F8FAFC" font-size="36" font-weight="820"><tspan>Clinical context →</tspan></text><text x="64" y="210" fill="#F8FAFC" font-size="36" font-weight="820"><tspan>reproducible validation →</tspan></text><text x="64" y="256" fill="#F8FAFC" font-size="36" font-weight="820"><tspan>evidence.</tspan></text>
    <text x="64" y="330" fill="#94A3B8" font-size="25"><tspan>Competition research only.</tspan></text><text x="64" y="370" fill="#94A3B8" font-size="25"><tspan>Not a clinical diagnostic or decision system.</tspan></text>
  </g>
</svg>
