<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1168" viewBox="0 0 800 1168" role="img" aria-labelledby="title desc">
  <title id="title">Project snapshot mobile</title><desc id="desc">Mobile stacked project snapshot cards.</desc>
  <rect width="800" height="1168" rx="32" fill="#0B1220"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true"><text x="64" y="80" fill="#F8FAFC" font-size="38" font-weight="820"><tspan>PROJECT SNAPSHOT</tspan></text></g>
    <text x="64" y="126" fill="#94A3B8" font-size="24"><tspan>Competition research at a glance</tspan></text>
    <g data-grid="16">
      <rect x="64" y="176" width="672" height="192" rx="24" fill="#101A2B" stroke="#223149"/>
      <rect x="64" y="384" width="672" height="192" rx="24" fill="#101A2B" stroke="#223149"/>
      <rect x="64" y="592" width="672" height="192" rx="24" fill="#17142A" stroke="#6D5AA0"/>
      <rect x="64" y="800" width="672" height="288" rx="24" fill="#271923" stroke="#8B4A41"/>
