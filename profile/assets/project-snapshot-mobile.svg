<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1136" viewBox="0 0 800 1136" role="img" aria-labelledby="title desc">
<title id="title">Project snapshot mobile</title><desc id="desc">Four equal mobile cards with common internal label, primary, and secondary baselines.</desc>
<rect width="800" height="1136" rx="32" fill="#0B1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="80" fill="#F8FAFC" font-size="38" font-weight="830"><tspan>PROJECT SNAPSHOT</tspan></text></g><text x="64" y="126" fill="#94A3B8" font-size="24"><tspan>Competition research at a glance</tspan></text>
  <g data-card-set="stack" data-grid="16">
    <g data-card="train"><rect x="64" y="176" width="672" height="208" rx="24" fill="#101A2B" stroke="#223149"/><text data-role="label" x="96" y="228" fill="#38BDF8" font-size="24" font-weight="820"><tspan>TRAIN</tspan></text><text data-role="primary" x="96" y="302" fill="#F8FAFC" font-size="54" font-weight="850"><tspan>256,351</tspan></text><text data-role="secondary" x="96" y="350" fill="#94A3B8" font-size="26"><tspan>rows · 69 columns</tspan></text></g>
    <g data-card="test"><rect x="64" y="400" width="672" height="208" rx="24" fill="#101A2B" stroke="#223149"/><text data-role="label" x="96" y="452" fill="#38BDF8" font-size="24" font-weight="820"><tspan>TEST</tspan></text><text data-role="primary" x="96" y="526" fill="#F8FAFC" font-size="54" font-weight="850"><tspan>90,067</tspan></text><text data-role="secondary" x="96" y="574" fill="#94A3B8" font-size="26"><tspan>rows · 68 columns</tspan></text></g>
    <g data-card="metric"><rect x="64" y="624" width="672" height="208" rx="24" fill="#17142A" stroke="#6D5AA0"/><text data-role="label" x="96" y="676" fill="#A78BFA" font-size="24" font-weight="820"><tspan>OFFICIAL METRIC</tspan></text><text data-role="primary" x="96" y="750" fill="#F8FAFC" font-size="54" font-weight="850"><tspan>ROC-AUC</tspan></text><text data-role="secondary" x="96" y="798" fill="#94A3B8" font-size="26"><tspan>probability ranking quality</tspan></text></g>
    <g data-card="insight"><rect x="64" y="848" width="672" height="208" rx="24" fill="#271923" stroke="#8B4A41"/><text data-role="label" x="96" y="900" fill="#FF7A66" font-size="24" font-weight="820"><tspan>CENTRAL INSIGHT</tspan></text><text data-role="primary" x="96" y="974" fill="#F8FAFC" font-size="34" font-weight="800"><tspan x="96">Missingness can encode</tspan><tspan x="96" dy="40">treatment structure.</tspan></text></g>
  </g>
</g>
</svg>