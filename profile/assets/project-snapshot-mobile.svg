    <text x="96" y="224" fill="#38BDF8" font-size="24" font-weight="800"><tspan>TRAIN</tspan></text><text x="96" y="298" fill="#F8FAFC" font-size="54" font-weight="840"><tspan>256,351</tspan></text><text x="96" y="338" fill="#94A3B8" font-size="26"><tspan>rows · 69 columns</tspan></text>
    <text x="96" y="432" fill="#38BDF8" font-size="24" font-weight="800"><tspan>TEST</tspan></text><text x="96" y="506" fill="#F8FAFC" font-size="54" font-weight="840"><tspan>90,067</tspan></text><text x="96" y="546" fill="#94A3B8" font-size="26"><tspan>rows · 68 columns</tspan></text>
    <text x="96" y="640" fill="#A78BFA" font-size="24" font-weight="800"><tspan>OFFICIAL METRIC</tspan></text><text x="96" y="714" fill="#F8FAFC" font-size="54" font-weight="840"><tspan>ROC-AUC</tspan></text><text x="96" y="754" fill="#94A3B8" font-size="26"><tspan>probability ranking quality</tspan></text>
    <text x="96" y="852" fill="#FF7A66" font-size="24" font-weight="800"><tspan>CENTRAL INSIGHT</tspan></text><text x="96" y="916" fill="#F8FAFC" font-size="34" font-weight="780"><tspan>Missingness can encode</tspan></text><text x="96" y="958" fill="#F8FAFC" font-size="34" font-weight="780"><tspan>treatment structure.</tspan></text><text x="96" y="1024" fill="#CBD5E1" font-size="26"><tspan>Interpret IVF / DI context before</tspan></text><text x="96" y="1062" fill="#CBD5E1" font-size="26"><tspan>generic imputation.</tspan></text>
