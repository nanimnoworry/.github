<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Nanim No Worry repository map</title>
  <desc id="desc">PSP official project, planB post-submission research, and Research-Papers evidence archive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="55" y="48" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">REPOSITORY MAP</text>
  <text x="55" y="76" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">One project · three clearly separated responsibilities</text>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M360 174 H430"/><path d="M770 174 H840"/>
  </g>
  <g fill="#64748b"><path d="M430 174 l-11 -7 v14z"/><path d="M840 174 l-11 -7 v14z"/></g>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="110" width="305" height="132" rx="20" fill="#0f2742" stroke="#60a5fa" stroke-width="2"/>
    <text x="82" y="146" fill="#93c5fd" font-size="15" font-weight="700">OFFICIAL PROJECT SSOT</text>
    <text x="82" y="181" fill="#f8fafc" font-size="30" font-weight="800">PSP</text>
    <text x="82" y="211" fill="#cbd5e1" font-size="15">Final submission · lineage · reproducibility</text>

    <rect x="430" y="110" width="340" height="132" rx="20" fill="#24163f" stroke="#a78bfa" stroke-width="2"/>
    <text x="457" y="146" fill="#c4b5fd" font-size="15" font-weight="700">POST-SUBMISSION RESEARCH</text>
    <text x="457" y="181" fill="#f8fafc" font-size="30" font-weight="800">planB</text>
    <text x="457" y="211" fill="#ddd6fe" font-size="15">OOF · bootstrap · slice risk · champion lock</text>

    <rect x="840" y="110" width="305" height="132" rx="20" fill="#12352e" stroke="#34d399" stroke-width="2"/>
    <text x="867" y="146" fill="#6ee7b7" font-size="15" font-weight="700">EVIDENCE ARCHIVE</text>
    <text x="867" y="181" fill="#f8fafc" font-size="27" font-weight="800">Research-Papers</text>
    <text x="867" y="211" fill="#d1fae5" font-size="15">Clinical evidence · APA · presentations</text>
  </g>

  <g filter="url(#glow)">
    <circle cx="395" cy="174" r="4" fill="#60a5fa"><animate attributeName="cx" values="370;420;370" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="805" cy="174" r="4" fill="#34d399"><animate attributeName="cx" values="780;830;780" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>