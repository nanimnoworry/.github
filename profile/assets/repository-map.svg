<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Nanim No Worry repository map</title>
  <desc id="desc">PSP is the official project hub. planB branches into post-submission research, while Research-Papers separately preserves evidence and presentation artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071426"/><stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <text x="55" y="48" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">REPOSITORY MAP</text>
  <text x="55" y="76" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">One project · three clearly separated responsibilities</text>

  <!-- central official hub -->
  <g font-family="Arial, sans-serif">
    <rect x="395" y="102" width="410" height="108" rx="20" fill="#0f2742" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="425" y="137" fill="#93c5fd" font-size="15" font-weight="700">OFFICIAL PROJECT SSOT</text>
    <text x="425" y="174" fill="#f8fafc" font-size="32" font-weight="800">PSP</text>
    <text x="515" y="174" fill="#cbd5e1" font-size="15">Final submission · lineage · reproducibility</text>
  </g>

  <!-- two separate responsibilities branching from PSP -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M535 210 C500 240 405 244 320 258"/>
    <path d="M665 210 C700 240 795 244 880 258"/>
  </g>
  <g fill="#64748b">
    <path d="M320 258 l12 -9 2 14z"/>
    <path d="M880 258 l-12 -9 -2 14z"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="238" width="360" height="78" rx="18" fill="#24163f" stroke="#a78bfa" stroke-width="2"/>
    <text x="82" y="270" fill="#c4b5fd" font-size="14" font-weight="700">POST-SUBMISSION RESEARCH</text>
    <text x="82" y="298" fill="#f8fafc" font-size="25" font-weight="800">planB</text>
    <text x="175" y="298" fill="#ddd6fe" font-size="14">OOF · bootstrap · slice risk</text>

    <rect x="785" y="238" width="360" height="78" rx="18" fill="#12352e" stroke="#34d399" stroke-width="2"/>
    <text x="812" y="270" fill="#6ee7b7" font-size="14" font-weight="700">EVIDENCE ARCHIVE</text>
    <text x="812" y="298" fill="#f8fafc" font-size="23" font-weight="800">Research-Papers</text>
    <text x="1002" y="298" fill="#d1fae5" font-size="14">APA · presentations</text>
  </g>

  <g filter="url(#glow)">
    <circle cx="490" cy="226" r="4" fill="#a78bfa">
      <animate attributeName="cx" values="535;430;330" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;244;258" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="226" r="4" fill="#34d399">
      <animate attributeName="cx" values="665;770;870" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;244;258" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>