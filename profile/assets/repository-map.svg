<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Nanim No Worry repository map</title>
  <desc id="desc">PSP is the official project SSOT. BS preserves contributor modeling research, planB contains post-submission research, and Research-Papers preserves evidence and presentation artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071426"/><stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <text x="55" y="48" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">REPOSITORY MAP</text>
  <text x="55" y="76" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">One project · four separated repository roles</text>

  <g font-family="Arial, sans-serif">
    <rect x="395" y="102" width="410" height="108" rx="20" fill="#0f2742" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="425" y="137" fill="#93c5fd" font-size="15" font-weight="700">OFFICIAL PROJECT SSOT</text>
    <text x="425" y="174" fill="#f8fafc" font-size="32" font-weight="800">PSP</text>
    <text x="515" y="174" fill="#cbd5e1" font-size="15">Final submission · lineage · reproducibility</text>
  </g>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M500 210 C455 242 335 250 235 270"/>
    <path d="M600 210 C600 238 600 248 600 270"/>
    <path d="M700 210 C745 242 865 250 965 270"/>
  </g>
  <g fill="#64748b">
    <path d="M235 270 l12 -9 2 14z"/>
    <path d="M600 270 l-7 -13 14 0z"/>
    <path d="M965 270 l-12 -9 -2 14z"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="35" y="264" width="330" height="92" rx="18" fill="#342016" stroke="#fb923c" stroke-width="2"/>
    <text x="62" y="296" fill="#fdba74" font-size="14" font-weight="700">MODELING WORKSPACE</text>
    <text x="62" y="327" fill="#f8fafc" font-size="25" font-weight="800">BS</text>
    <text x="112" y="327" fill="#fed7aa" font-size="14">OOF · weighted/rank ensemble</text>

    <rect x="435" y="264" width="330" height="92" rx="18" fill="#24163f" stroke="#a78bfa" stroke-width="2"/>
    <text x="462" y="296" fill="#c4b5fd" font-size="14" font-weight="700">POST-SUBMISSION RESEARCH</text>
    <text x="462" y="327" fill="#f8fafc" font-size="25" font-weight="800">planB</text>
    <text x="555" y="327" fill="#ddd6fe" font-size="14">bootstrap · slice risk</text>

    <rect x="835" y="264" width="330" height="92" rx="18" fill="#12352e" stroke="#34d399" stroke-width="2"/>
    <text x="862" y="296" fill="#6ee7b7" font-size="14" font-weight="700">EVIDENCE ARCHIVE</text>
    <text x="862" y="327" fill="#f8fafc" font-size="22" font-weight="800">Research-Papers</text>
    <text x="1042" y="327" fill="#d1fae5" font-size="14">APA · presentations</text>
  </g>

  <g filter="url(#glow)">
    <circle r="4" fill="#fb923c">
      <animate attributeName="cx" values="500;370;245" dur="4.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;248;270" dur="4.0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#a78bfa">
      <animate attributeName="cx" values="600;600;600" dur="4.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;244;270" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#34d399">
      <animate attributeName="cx" values="700;830;955" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;248;270" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>