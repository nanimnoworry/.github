<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1280" viewBox="0 0 800 1280" role="img" aria-labelledby="title desc">
<title id="title">Model journey mobile</title><desc id="desc">Four equal stacked lineage cards share the same internal label, primary, metric, and note anchors.</desc>
<rect width="800" height="1280" rx="32" fill="#0B1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="80" fill="#F8FAFC" font-size="38" font-weight="830"><tspan>MODEL JOURNEY</tspan></text></g><text x="64" y="126" fill="#94A3B8" font-size="24"><tspan>Official lineage first · later research separate</tspan></text>
  <g data-card-set="stack" data-grid="16">
    <g data-card="plan1"><rect x="64" y="176" width="672" height="240" rx="24" fill="#101A2B" stroke="#334155"/><text data-role="label" x="96" y="228" fill="#94A3B8" font-size="24" font-weight="820"><tspan>PLAN 1 · BASELINE</tspan></text><text data-role="primary" x="96" y="296" fill="#F8FAFC" font-size="36" font-weight="800"><tspan>OOF ensemble</tspan></text><text data-role="metric" x="96" y="356" fill="#CBD5E1" font-size="42" font-weight="850"><tspan>0.74213</tspan></text><text data-role="note" x="96" y="392" fill="#64748B" font-size="24"><tspan>submission AUC</tspan></text></g>
    <g data-card="plan2"><rect x="64" y="432" width="672" height="240" rx="24" fill="#0F2236" stroke="#38BDF8" stroke-width="3"/><text data-role="label" x="96" y="484" fill="#38BDF8" font-size="24" font-weight="820"><tspan>PLAN 2 · HIGHEST SUBMITTED</tspan></text><text data-role="primary" x="96" y="552" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Feature expansion + stacking</tspan></text><text data-role="metric" x="96" y="612" fill="#BAE6FD" font-size="42" font-weight="850"><tspan>0.74232</tspan></text><text data-role="note" x="96" y="648" fill="#64748B" font-size="24"><tspan>highest submitted AUC</tspan></text></g>
    <g data-card="plan3"><rect x="64" y="688" width="672" height="240" rx="24" fill="#17142A" stroke="#A78BFA" stroke-width="4"/><text data-role="label" x="96" y="740" fill="#A78BFA" font-size="24" font-weight="820"><tspan>PLAN 3 · FINAL ADOPTED</tspan></text><text data-role="primary" x="96" y="808" fill="#F8FAFC" font-size="36" font-weight="800"><tspan>OOF + Multi-Seed</tspan></text><text data-role="metric" x="96" y="868" fill="#DDD6FE" font-size="42" font-weight="850"><tspan>0.74231</tspan></text><text data-role="note" x="96" y="904" fill="#94A3B8" font-size="24"><tspan>final adopted submission model</tspan></text></g>
    <g data-card="post"><rect x="64" y="944" width="672" height="240" rx="24" fill="#111827" stroke="#475569" stroke-dasharray="12 12"/><text data-role="label" x="96" y="996" fill="#94A3B8" font-size="24" font-weight="820"><tspan>AFTER OFFICIAL SUBMISSION</tspan></text><text data-role="primary" x="96" y="1064" fill="#F8FAFC" font-size="36" font-weight="800"><tspan>planB research</tspan></text><text data-role="metric" x="96" y="1124" fill="#CBD5E1" font-size="30" font-weight="820"><tspan>separate lineage</tspan></text><text data-role="note" x="96" y="1160" fill="#64748B" font-size="24"><tspan>official result unchanged</tspan></text></g>
  </g>
</g>
</svg>