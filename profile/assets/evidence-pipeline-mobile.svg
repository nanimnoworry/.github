<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1472" viewBox="0 0 800 1472" role="img" aria-labelledby="title desc">
  <title id="title">Evidence pipeline mobile</title><desc id="desc">Five readable stacked stages from competition signals to evidence.</desc>
  <rect width="800" height="1472" rx="32" fill="#F8FAFC"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true"><text x="64" y="80" fill="#0B1220" font-size="38" font-weight="820"><tspan>EVIDENCE PIPELINE</tspan></text></g>
    <text x="64" y="126" fill="#64748B" font-size="24"><tspan>Five stages · one evidence chain</tspan></text>
    <path d="M96 238 V1308" stroke="#CBD5E1" stroke-width="5"/>
    <g data-grid="16">
      <rect x="128" y="176" width="608" height="208" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="128" y="400" width="608" height="208" rx="24" fill="#FFF7F5" stroke="#FFB5A8"/>
      <rect x="128" y="624" width="608" height="208" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/>
      <rect x="128" y="848" width="608" height="208" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/>
      <rect x="128" y="1072" width="608" height="272" rx="24" fill="#0B1220" stroke="#0B1220"/>
    </g>
    <g font-size="24" font-weight="820"><text x="160" y="226" fill="#64748B"><tspan>01 · SIGNALS</tspan></text><text x="160" y="450" fill="#D95F4F"><tspan>02 · CONTEXT</tspan></text><text x="160" y="674" fill="#7C5FD1"><tspan>03 · DIVERSITY</tspan></text><text x="160" y="898" fill="#0284C7"><tspan>04 · VALIDATION</tspan></text><text x="160" y="1122" fill="#38BDF8"><tspan>05 · EVIDENCE</tspan></text></g>
    <text x="160" y="282" fill="#0B1220" font-size="34" font-weight="780"><tspan>Competition table</tspan></text><text x="160" y="330" fill="#64748B" font-size="26"><tspan>age · treatment · embryo · history</tspan></text>
    <text x="160" y="506" fill="#0B1220" font-size="34" font-weight="780"><tspan>Structural missingness</tspan></text><text x="160" y="554" fill="#64748B" font-size="26"><tspan>not-applicable patterns as signal</tspan></text>
    <text x="160" y="730" fill="#0B1220" font-size="34" font-weight="780"><tspan>Model diversity</tspan></text><text x="160" y="778" fill="#64748B" font-size="26"><tspan>CatBoost · LightGBM · XGBoost</tspan></text>
    <text x="160" y="954" fill="#0B1220" font-size="34" font-weight="780"><tspan>OOF-first review</tspan></text><text x="160" y="1002" fill="#64748B" font-size="26"><tspan>K-fold evidence over one split</tspan></text>
    <text x="160" y="1182" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Score + complexity + stability</tspan></text><text x="160" y="1240" fill="#CBD5E1" font-size="26"><tspan>Highest submitted and final adopted</tspan></text><text x="160" y="1278" fill="#CBD5E1" font-size="26"><tspan>remain explicitly separate.</tspan></text>
  </g>
</svg>
