<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1392" viewBox="0 0 800 1392" role="img" aria-labelledby="title desc">
  <title id="title">Evidence pipeline mobile</title><desc id="desc">Five equal stacked evidence-stage cards for mobile.</desc>
  <rect width="800" height="1392" rx="32" fill="#F8FAFC"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true"><text x="64" y="80" fill="#0B1220" font-size="38" font-weight="830"><tspan>EVIDENCE PIPELINE</tspan></text></g>
    <text x="64" y="126" fill="#64748B" font-size="24"><tspan>Five stages · one evidence chain</tspan></text>
    <g data-card-stack="true" data-grid="16">
      <rect x="64" y="176" width="672" height="208" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="64" y="400" width="672" height="208" rx="24" fill="#FFF7F5" stroke="#FFB5A8"/>
      <rect x="64" y="624" width="672" height="208" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/>
      <rect x="64" y="848" width="672" height="208" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/>
      <rect x="64" y="1072" width="672" height="208" rx="24" fill="#0B1220" stroke="#0B1220"/>
    </g>
    <text x="96" y="228" fill="#64748B" font-size="24" font-weight="820"><tspan>01 · SIGNALS</tspan></text><text x="96" y="290" fill="#0B1220" font-size="34" font-weight="800"><tspan>Competition table</tspan></text><text x="96" y="338" fill="#64748B" font-size="26"><tspan>age · treatment · embryo · history</tspan></text>
    <text x="96" y="452" fill="#D95F4F" font-size="24" font-weight="820"><tspan>02 · CONTEXT</tspan></text><text x="96" y="514" fill="#0B1220" font-size="34" font-weight="800"><tspan>Structural missingness</tspan></text><text x="96" y="562" fill="#64748B" font-size="26"><tspan>not-applicable patterns as signal</tspan></text>
    <text x="96" y="676" fill="#7C5FD1" font-size="24" font-weight="820"><tspan>03 · DIVERSITY</tspan></text><text x="96" y="738" fill="#0B1220" font-size="34" font-weight="800"><tspan>Model lanes</tspan></text><text x="96" y="786" fill="#64748B" font-size="26"><tspan>CatBoost · LightGBM · XGBoost</tspan></text>
    <text x="96" y="900" fill="#0284C7" font-size="24" font-weight="820"><tspan>04 · VALIDATION</tspan></text><text x="96" y="962" fill="#0B1220" font-size="34" font-weight="800"><tspan>OOF-first review</tspan></text><text x="96" y="1010" fill="#64748B" font-size="26"><tspan>K-fold evidence over one split</tspan></text>
    <text x="96" y="1124" fill="#38BDF8" font-size="24" font-weight="820"><tspan>05 · EVIDENCE</tspan></text><text x="96" y="1186" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Score + complexity + stability</tspan></text><text x="96" y="1234" fill="#CBD5E1" font-size="26"><tspan>highest submitted ≠ final adopted</tspan></text>
  </g>
</svg>