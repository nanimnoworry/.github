<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1392" viewBox="0 0 800 1392" role="img" aria-labelledby="title desc">
<title id="title">Evidence pipeline mobile</title><desc id="desc">Five equal stacked evidence cards with identical internal text anchors.</desc>
<rect width="800" height="1392" rx="32" fill="#F8FAFC"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="80" fill="#0B1220" font-size="38" font-weight="830"><tspan>EVIDENCE PIPELINE</tspan></text></g><text x="64" y="126" fill="#64748B" font-size="24"><tspan>Five stages · one evidence chain</tspan></text>
  <g data-card-set="stack" data-grid="16">
    <g data-card="signals"><rect x="64" y="176" width="672" height="208" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/><text data-role="label" x="96" y="228" fill="#64748B" font-size="24" font-weight="820"><tspan>01 · SIGNALS</tspan></text><text data-role="primary" x="96" y="296" fill="#0B1220" font-size="34" font-weight="800"><tspan>Competition table</tspan></text><text data-role="secondary" x="96" y="344" fill="#64748B" font-size="26"><tspan>age · treatment · embryo · history</tspan></text></g>
    <g data-card="context"><rect x="64" y="400" width="672" height="208" rx="24" fill="#FFF7F5" stroke="#FFB5A8"/><text data-role="label" x="96" y="452" fill="#D95F4F" font-size="24" font-weight="820"><tspan>02 · CONTEXT</tspan></text><text data-role="primary" x="96" y="520" fill="#0B1220" font-size="34" font-weight="800"><tspan>Structural missingness</tspan></text><text data-role="secondary" x="96" y="568" fill="#64748B" font-size="26"><tspan>not-applicable patterns as signal</tspan></text></g>
    <g data-card="diversity"><rect x="64" y="624" width="672" height="208" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/><text data-role="label" x="96" y="676" fill="#7C5FD1" font-size="24" font-weight="820"><tspan>03 · DIVERSITY</tspan></text><text data-role="primary" x="96" y="744" fill="#0B1220" font-size="34" font-weight="800"><tspan>Model lanes</tspan></text><text data-role="secondary" x="96" y="792" fill="#64748B" font-size="26"><tspan>CatBoost · LightGBM · XGBoost</tspan></text></g>
    <g data-card="validation"><rect x="64" y="848" width="672" height="208" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/><text data-role="label" x="96" y="900" fill="#0284C7" font-size="24" font-weight="820"><tspan>04 · VALIDATION</tspan></text><text data-role="primary" x="96" y="968" fill="#0B1220" font-size="34" font-weight="800"><tspan>OOF-first review</tspan></text><text data-role="secondary" x="96" y="1016" fill="#64748B" font-size="26"><tspan>K-fold evidence over one split</tspan></text></g>
    <g data-card="evidence"><rect x="64" y="1072" width="672" height="208" rx="24" fill="#0B1220" stroke="#0B1220"/><text data-role="label" x="96" y="1124" fill="#38BDF8" font-size="24" font-weight="820"><tspan>05 · EVIDENCE</tspan></text><text data-role="primary" x="96" y="1192" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Score + complexity + stability</tspan></text><text data-role="secondary" x="96" y="1240" fill="#CBD5E1" font-size="26"><tspan>highest submitted ≠ final adopted</tspan></text></g>
  </g>
</g>
</svg>