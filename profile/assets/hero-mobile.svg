<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc">
  <title id="title">NANIM NO WORRY mobile evidence assay</title>
  <desc id="desc">Mobile hero with aligned signal cards, animated assay rings, flowing evidence particles, and a prominent OOF evidence core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#17142A"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#A78BFA" stop-opacity="0.26"/><stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.08"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="960" rx="32" fill="url(#bg)"/>
  <circle cx="400" cy="802" r="176" fill="url(#aura)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true"><text x="64" y="84" fill="#38BDF8" font-size="26" font-weight="820" letter-spacing="2"><tspan>FERTILITY AI · EVIDENCE ASSAY</tspan></text></g>
    <text x="64" y="160" fill="#F8FAFC" font-size="58" font-weight="850"><tspan>NANIM NO WORRY</tspan></text>
    <text x="64" y="214" fill="#CBD5E1" font-size="28" font-weight="700"><tspan>Fertility outcome prediction research</tspan></text>
    <text x="64" y="266" fill="#94A3B8" font-size="24"><tspan>Structural context → OOF validation → evidence</tspan></text>

    <g data-card-stack="true" data-grid="16">
      <rect x="64" y="320" width="672" height="96" rx="24" fill="#0F2236" stroke="#38BDF8"/>
      <rect x="64" y="432" width="672" height="96" rx="24" fill="#271923" stroke="#FF7A66"/>
      <rect x="64" y="544" width="672" height="96" rx="24" fill="#17142A" stroke="#A78BFA"/>
    </g>
    <text x="96" y="378" fill="#BAE6FD" font-size="28" font-weight="780"><tspan>Clinical signals</tspan></text>
    <text x="96" y="490" fill="#FFD2CA" font-size="28" font-weight="780"><tspan>Structural missingness context</tspan></text>
    <text x="96" y="602" fill="#DDD6FE" font-size="28" font-weight="780"><tspan>CatBoost · LightGBM · XGBoost</tspan></text>

    <path d="M400 640 V694" stroke="#A78BFA" stroke-width="4"/>
    <circle cy="666" r="5" fill="#A78BFA" filter="url(#g)">
      <animate attributeName="cx" values="240;560;240" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(400 790)">
      <circle r="126" fill="url(#aura)"/>
      <circle r="104" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="14 14" opacity="0.38">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle r="80" fill="none" stroke="#A78BFA" stroke-width="4" stroke-dasharray="32 12" opacity="0.62">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="52" fill="#0E1B2B" stroke="#A78BFA" stroke-width="4"/>
      <circle r="18" fill="#F8FAFC" filter="url(#g)">
        <animate attributeName="r" values="14;21;14" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g><line x1="0" y1="-52" x2="0" y2="-108" stroke="#F8FAFC" stroke-width="3" opacity="0.4"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></g>
    </g>
    <text x="302" y="936" fill="#F8FAFC" font-size="26" font-weight="820"><tspan>OOF EVIDENCE</tspan></text>
  </g>
</svg>