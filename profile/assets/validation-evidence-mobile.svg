<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1056" viewBox="0 0 800 1056" role="img" aria-labelledby="title desc">
  <title id="title">Validation evidence mobile</title><desc id="desc">Stacked mobile comparison of highest submitted and final adopted result.</desc>
  <rect width="800" height="1056" rx="32" fill="#F8FAFC"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g data-title="true"><text x="64" y="80" fill="#0B1220" font-size="38" font-weight="820"><tspan>VALIDATION ≠ ONE NUMBER</tspan></text></g>
    <text x="64" y="126" fill="#64748B" font-size="24"><tspan>Highest submitted ≠ final adopted</tspan></text>
    <g data-grid="16">
      <rect x="64" y="176" width="672" height="320" rx="24" fill="#F0F9FF" stroke="#7DD3FC"/>
      <rect x="64" y="512" width="672" height="368" rx="24" fill="#F5F3FF" stroke="#C4B5FD"/>
    </g>
    <text x="96" y="228" fill="#0284C7" font-size="24" font-weight="820"><tspan>HIGHEST SUBMITTED · PLAN 2</tspan></text><text x="96" y="316" fill="#0B1220" font-size="64" font-weight="840"><tspan>0.74232</tspan></text><text x="96" y="376" fill="#475569" font-size="27"><tspan>feature expansion · weighted / stacking</tspan></text><text x="96" y="428" fill="#64748B" font-size="24"><tspan>Historical benchmark, not final adoption.</tspan></text>
    <text x="96" y="564" fill="#7C5FD1" font-size="24" font-weight="820"><tspan>FINAL ADOPTED · PLAN 3</tspan></text><text x="96" y="652" fill="#0B1220" font-size="64" font-weight="840"><tspan>0.74231</tspan></text><text x="96" y="712" fill="#475569" font-size="27"><tspan>OOF + Multi-Seed</tspan></text><text x="96" y="762" fill="#64748B" font-size="24"><tspan>Complexity · validation burden · seed</tspan></text><text x="96" y="798" fill="#64748B" font-size="24"><tspan>variability · compute also considered.</tspan></text>
    <text x="64" y="946" fill="#64748B" font-size="22"><tspan>Competition research only · no clinical validation claim.</tspan></text>
  </g>
</svg>
